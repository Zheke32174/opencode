apiVersion: modos.pleiades/v1alpha1
kind: Component
metadata:
  name: underlode-dependency-mine
  repository: Zheke32174/underlode
  visibility: public
  lifecycle: reference
  defaultBranch: dev
  labels:
    modos.pleiades/subsystem: reference-corpus
    modos.pleiades/organ-class: dependency-and-mechanism-mine
spec:
  roles:
    - large-resource-corpus
    - dependency-mine
    - mechanism-reference
    - compatibility-source
  authority: none
  inputs:
    - upstream-projects
    - dependency-metadata
    - implementation-examples
  outputs:
    - dependency-candidates
    - mechanism-extracts
    - compatibility-and-risk-evidence
  capabilitiesProvided:
    - corpus.dependency.read@v1
    - mechanism.reference.mine@v1
    - dependency.adapter.propose@v1
  capabilitiesRequired:
    - provenance.preserve@v1
    - license.inspect@v1
    - context.immunity.inspect@v1
    - ghost.world.execute@v1
  dataClasses:
    - public
    - internal
    - untrusted
  failurePolicy: read-only
  promotionPolicy: evidence-gated
  relations:
    - type: supports
      targetRef: repo:Zheke32174/pleiades
      scope: build
      required: false
  notes: >-
    Underlode is mined selectively. Dependencies or code are not copied into
    production without license, provenance, security, context-immunity, and
    compatibility review. This update preserves the pre-existing identity and
    read-only authority while bringing capability names under the promoted
    versioned schema.
